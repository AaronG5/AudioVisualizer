[project]
name = "audiovisualizer"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "numpy==2.5.2",
    "pyqt6==6.11.0",
    "pyqtgraph==0.14.0",
    "soundfile==0.14.0",
]
[project.scripts]
audiovisualizer = "audiovisualizer.__main__:main"
[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"